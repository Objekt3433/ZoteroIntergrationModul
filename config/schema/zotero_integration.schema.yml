zotero_integration.settings:
  type: config_object
  label: 'Zotero Integration Einstellungen'
  mapping:
    api_key:
      type: string
      label: 'Zotero API Key'
    library_type:
      type: string
      label: 'Bibliothekstyp (user/group)'
    library_id:
      type: string
      label: 'Library ID'
    collection_key:
      type: string
      label: 'Collection Key (optional)'
    item_limit:
      type: integer
      label: 'Maximale Anzahl Einträge'
    cache_max_age:
      type: integer
      label: 'Cache-Dauer in Sekunden'
    style:
      type: string
      label: 'CSL-Zitierstil'
    locale:
      type: string
      label: 'Locale für Zitationen'
    output_mode:
      type: string
      label: 'Betriebsmodus (block/bibtex)'
    bibtex_directory:
      type: string
      label: 'Zielverzeichnis der BibTeX-Datei'
    bibtex_filename:
      type: string
      label: 'Dateiname der BibTeX-Datei'
